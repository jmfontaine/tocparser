# Release notes from Conventional Commits, for `just changelog-preview` and the
# GitHub release the publish workflow creates.

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}

    ## {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first }} - \
            ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/jmfontaine/tocparser/commit/{{ commit.id }}))
    {%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# The HTML comments only order the groups; `striptags` removes them from the headings.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^refactor", group = "<!-- 2 -->Refactoring" },
  { message = "^docs", group = "<!-- 3 -->Documentation" },
  { message = "^test", group = "<!-- 4 -->Testing" },
  { message = "^(chore|ci)", group = "<!-- 5 -->Miscellaneous Tasks" },
]
filter_commits = false
tag_pattern = "v[0-9].*"

[git.filter]
exclude_patterns = ["^Merge"]
