name: Publish

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  # Releases come from main. `just release` pushes main and the tag together,
  # but a tag pushed by hand could point anywhere.
  tag-on-main:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the tagged commit is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points to $GITHUB_SHA, which is not on main"
            exit 1
          fi

  # Every CI check, on the tagged commit. Its build job uploads the
  # distributions that its wheel and sdist jobs install and test.
  ci:
    needs: [tag-on-main]
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: [ci]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tocparser/
    permissions:
      # PyPI trusted publishing: no API token is stored anywhere.
      id-token: write
    steps:
      # The artifacts CI tested, never rebuilt, so PyPI gets exactly those.
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # A PyPI upload cannot be taken back, so a mismatch stops here.
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ ! -f "dist/tocparser-${TAG#v}-py3-none-any.whl" ]; then
            echo "::error::tag $TAG does not match the version built: $(ls dist)"
            exit 1
          fi
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Files already uploaded are skipped, so a full rerun after a later
          # failure gets past this job instead of failing on them.
          skip-existing: true

  github-release:
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      # The git-cliff pinned in uv.lock, the one `just changelog-preview` runs.
      - name: Generate release notes
        run: uv run --locked --only-group dev git-cliff --latest --output "$RUNNER_TEMP/notes.md"
      # A rerun finds the release a previous attempt created, and leaves it.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
