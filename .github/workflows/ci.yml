name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request makes a running check moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run pyproject-fmt --check pyproject.toml
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Verify public API type completeness
        run: uv run pyright --ignoreexternal --verifytypes tocparser

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.15 resolves to its newest release candidate until 3.15.0 is out.
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        resolution: [highest]
        include:
          # The oldest dependency versions pyproject.toml allows, on the oldest
          # Python and on 3.15, whose pydantic floor differs. Deprecations are
          # fatal there, so an old dependency calling an API Python deprecates
          # fails here rather than when that API is removed.
          - python: "3.10"
            resolution: lowest-direct
            warnings: -W error::DeprecationWarning -W error::PendingDeprecationWarning
          - python: "3.15"
            resolution: lowest-direct
            warnings: -W error::DeprecationWarning -W error::PendingDeprecationWarning
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: >-
          uv run --isolated --python ${{ matrix.python }}
          --resolution ${{ matrix.resolution }} --with pytest
          python ${{ matrix.warnings }} -m pytest

  # The expectations in tests/test_cdrdao_oracle.py were recorded with the
  # cdrdao Homebrew ships (1.2.6); the variable makes a missing cdrdao an error
  # rather than a skip.
  cdrdao-oracle:
    runs-on: macos-latest
    env:
      TOCPARSER_REQUIRE_CDRDAO: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: brew install cdrdao
      - run: cdrdao version || true
      - run: uv sync --locked
      - run: uv run pytest tests/test_cdrdao_oracle.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - name: Check distribution contents
        run: uv run --no-project python scripts/check_distributions.py dist
      - name: Check distribution metadata
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # The tests above run from the source tree. These install what would be
  # published into clean environments, resolving dependencies from the package
  # metadata instead of uv.lock, and test that.
  wheel:
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Python, and 3.15, whose pydantic floor differs.
        python: ["3.10", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Install the wheel with pip
        run: |
          uv venv --python ${{ matrix.python }} --seed /tmp/wheel-env
          /tmp/wheel-env/bin/python -m pip install --quiet dist/*.whl
          /tmp/wheel-env/bin/python -m pip check
      - name: Check the installed package
        run: /tmp/wheel-env/bin/python scripts/check_installed_package.py
      - name: Run the test suite against the installed wheel
        run: |
          /tmp/wheel-env/bin/python -m pip install --quiet pytest
          /tmp/wheel-env/bin/python -m pytest

  sdist:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Build and install the sdist with pip
        run: |
          uv venv --python 3.15 --seed /tmp/sdist-env
          /tmp/sdist-env/bin/python -m pip install --quiet dist/*.tar.gz
          /tmp/sdist-env/bin/python -m pip check
      - name: Check the installed package
        run: /tmp/sdist-env/bin/python scripts/check_installed_package.py
      - name: Run the sdist's own test suite, as a downstream packager would
        run: |
          mkdir /tmp/sdist-src
          tar -xzf dist/*.tar.gz -C /tmp/sdist-src --strip-components=1
          /tmp/sdist-env/bin/python -m pip install --quiet pytest
          cd /tmp/sdist-src && /tmp/sdist-env/bin/python -m pytest
