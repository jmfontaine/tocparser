version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # The uv ecosystem updates uv.lock. The pip one would leave it stale, failing
  # CI's `uv sync --locked`.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # A library's minimum versions are deliberate, and the lowest-direct CI jobs
    # test them, so only the lock moves. This does not stop Dependabot from
    # copying the Python 3.15 pydantic clause's specifier onto the general
    # pydantic requirement without updating the lock's requires-dist (#7, #9),
    # which fails `uv sync --locked`. Close such pull requests and relock by hand.
    versioning-strategy: "lockfile-only"
