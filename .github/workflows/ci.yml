name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request makes a running check moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.15 resolves to its newest release candidate until 3.15.0 is out.
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        resolution: [highest]
        include:
          # The oldest dependency versions pyproject.toml allows, on the oldest
          # Python and on 3.15, whose pydantic floor differs. Deprecations are
          # fatal there, so an old dependency calling an API Python deprecates
          # fails here rather than when that API is removed.
          - python: "3.10"
            resolution: lowest-direct
            warnings: -W error::DeprecationWarning -W error::PendingDeprecationWarning
          - python: "3.15"
            resolution: lowest-direct
            warnings: -W error::DeprecationWarning -W error::PendingDeprecationWarning
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: >-
          uv run --isolated --python ${{ matrix.python }}
          --resolution ${{ matrix.resolution }} --with pytest
          python ${{ matrix.warnings }} -m pytest

  # The expectations in tests/test_cdrdao_oracle.py were recorded with the
  # cdrdao Homebrew ships (1.2.6); the variable makes a missing cdrdao an error
  # rather than a skip.
  cdrdao-oracle:
    runs-on: macos-latest
    env:
      TOCPARSER_REQUIRE_CDRDAO: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: brew install cdrdao
      - run: cdrdao version || true
      - run: uv sync --locked
      - run: uv run pytest tests/test_cdrdao_oracle.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - run: uvx twine check --strict dist/*
